[package]
name = "HexGo"
version = "0.1.1"
edition = "2024"

[lib]
name = "hex_go"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = {
    version = "0.19.1",
    default-features = false,
    features = [
        "2d",
        "ui",
    ],
}

bevy_embedded_assets = "0.16"
rand = "0.10.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
burn = { version = "0.21", features = ["flex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = {
    version = "0.19.1",
    default-features = false,
    features = ["android-game-activity"],
}

[package.metadata.android]
version-code = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace]
members = [
    ".",
    "training",
]

resolver = "3"