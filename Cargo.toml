[package]
name = "HexGo"
version = "0.2.0-alpha.2"
edition = "2024"

[lib]
name = "hex_go"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = {
    version = "0.19.1",
    default-features = false,
    features = [
        "2d",
        "ui",
    ],
}

bevy_embedded_assets = "0.16"
rand = "0.10.2"
rand_distr = "0.6.0"
getrandom = { version = "0.4", features = ["wasm_js"] }
burn = { version = "0.21", features = ["flex"] }
burn-store = { version = "0.21.0", default-features = false, features = ["burnpack", "std"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
ricci = "0.10.0"


[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
bevy = {
    version = "0.19.1",
    default-features = false,
    features = ["webgl2"],
}
[target.'cfg(target_os = "android")'.dependencies]
bevy = {
    version = "0.19.1",
    default-features = false,
    features = ["android-game-activity"],
}

[features]
default = ["cpu"]
cpu = []
cuda = ["burn/cuda","burn/fusion"]

[package.metadata.android]
version-code = 4

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace]
members = [
    ".",
    "training",
]

resolver = "3"
