[package]
name = "hexgo-train"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.21", features = ["flex","autodiff"] }
burn-store = "0.21.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
bincode = "1.3"
rayon = "1.11"
rand = "0.10.2"
HexGo = { path = ".." }
clap = { version = "4.6.7", features = ["derive","color"] }
clap-cargo = "0.19.0"
zstd = "0.14.0"
ricci = "0.10.0"

[features]
default = ["cpu"]
cpu = []
cuda = ["burn/cuda", "burn/fusion","HexGo/cuda"]

[profile.dev]
# Limit debug symbols to line-level info to drastically reduce binary size (cuts ~80% of DWARF bloat from Bevy/Burn)
debug = 1

# Optimize external dependencies (Bevy, Burn, etc.) in dev builds to prevent binary bloat and boost runtime performance
[profile.dev.package."*"]
opt-level = 3
