name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: false
        default: dev
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Get Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi

          if [[ "$VERSION" != "dev" ]]; then
            SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

            if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
              echo "Invalid semantic version: $VERSION" >&2
              exit 1
            fi
          fi

          if [[ "$VERSION" == "dev" ]]; then
            PRERELEASE=true
          else
            CORE="${VERSION%%+*}"
            if [[ "$CORE" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: get-version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-windows:
    needs: get-version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-macos:
    needs: get-version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

  build-android:
    needs: get-version
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
    secrets: inherit

  build-web:
    needs: get-version
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-web
      - get-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
          prerelease: ${{ needs.get-version.outputs.prerelease == 'true' }}

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY is empty. Please configure the BUTLER_API_KEY repository secret."
            exit 1
          fi

          VERSION="${{ needs.get-version.outputs.version }}"
          ITCH_TARGET="zhenyan121/hexgo"

          cp "artifacts/HexGo-${VERSION}-windows-x86_64.zip" "artifacts/HexGo-windows-x86_64.zip"
          cp "artifacts/HexGo-${VERSION}-linux-x86_64.zip"   "artifacts/HexGo-linux-x86_64.zip"
          cp "artifacts/HexGo-${VERSION}-macos-arm64.zip"    "artifacts/HexGo-macos-arm64.zip"
          cp "artifacts/HexGo-${VERSION}-android-arm64.apk"  "artifacts/HexGo-android-arm64.apk"
          cp "artifacts/HexGo-${VERSION}-web.zip"            "artifacts/HexGo-web.zip"

          echo "Publishing HexGo v${VERSION} to itch.io (${ITCH_TARGET})..."

          butler push "artifacts/HexGo-windows-x86_64.zip" "${ITCH_TARGET}:windows-x64" --userversion "${VERSION}"
          butler push "artifacts/HexGo-linux-x86_64.zip"   "${ITCH_TARGET}:linux-x64"   --userversion "${VERSION}"
          butler push "artifacts/HexGo-macos-arm64.zip"    "${ITCH_TARGET}:osx-arm64"   --userversion "${VERSION}"
          butler push "artifacts/HexGo-android-arm64.apk"  "${ITCH_TARGET}:android"     --userversion "${VERSION}"
          butler push "artifacts/HexGo-web.zip"            "${ITCH_TARGET}:html5"       --userversion "${VERSION}"
